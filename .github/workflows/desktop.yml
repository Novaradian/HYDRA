# Builds HYDRA for Windows on GitHub's free runner: the web build (HYDRA.html folder), HYDRA.exe (portable),
# the per-user installer (NSIS, no admin) and the MSI. Run it from the Actions tab ("Run workflow"), or push a tag
# such as v0.8.0 to also publish a GitHub Release with the files attached.
name: Build HYDRA (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # only used to attach files to a Release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Web build (dist/HYDRA) + MCP tool list
        working-directory: app
        run: |
          npm ci
          node build.mjs

      - name: Rust unit tests — AI bridge (listener, token, MCP protocol, Claude Desktop config)
        working-directory: desktop/src-tauri
        run: 'cargo test --lib ai::'

      - name: Desktop build — HYDRA.exe, installer, MSI
        working-directory: desktop
        run: |
          npm ci
          npx tauri build

      - name: Check HYDRA.exe --mcp over stdio (as Claude Desktop starts it)
        run: python tests/a5_mcp_stdio.py desktop/src-tauri/target/release/hydra.exe

      - name: Collect files
        shell: pwsh
        run: |
          $v = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item desktop/src-tauri/target/release/hydra.exe "out/HYDRA-$v-portable.exe"
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi out/
          Compress-Archive -Path dist/HYDRA -DestinationPath "out/HYDRA-$v.zip"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: HYDRA-windows
          path: out/*
          if-no-files-found: error

      - name: Publish Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
