[package]
name = "hydra"
version = "0.8.0"
description = "HYDRA — offline hydraulic, pneumatic and electrical CAD and simulator"
license = "MIT"
authors = ["Jignesh"]
edition = "2021"

[lib]
name = "hydra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["windows-native"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
